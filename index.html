<title>Well-being Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0d0f16;--card:#181b26;--ink:#f4f5fa;--muted:#9ba1b8;--line:#2a2f42;--accent:#8ef5a8;--on-accent:#06240f;--accent2:#ffb21e;--ex:#ff5c5c;--blue:#5aa2ff;--purple:#b26bff;--red:#ff7a1a;--r:18px;--nav:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
header{position:sticky;top:0;z-index:5;background:rgba(13,15,22,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;margin:0;letter-spacing:-.3px}
header .sub{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:20px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:4px 14px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 20px rgba(0,0,0,.35)}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.big small{font-size:15px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
button.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;cursor:pointer}
button.ghost{min-height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;padding:0 16px}
button.danger{color:var(--red);border-color:rgba(255,122,26,.45)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:34px;line-height:1;box-shadow:0 6px 22px rgba(142,245,168,.55);cursor:pointer;z-index:6;display:none}
.fab.show{display:block}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
ul.list li:last-child{border-bottom:0}
ul.list li .t{flex:1;min-width:0}
ul.list li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.list li .t span{font-size:13px;color:var(--muted)}
ul.list li .v{font-weight:700;white-space:nowrap}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 2px;display:flex;justify-content:space-between}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{margin-bottom:8px;opacity:.85}.ico{display:inline-block;vertical-align:middle;flex:none}.lic{width:28px;display:grid;place-items:center;flex:none}h2 .ico{margin-right:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(20,23,33,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav button{flex:1;height:var(--nav);border:0;background:none;font-size:11px;font-weight:600;color:#8a91a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button .i{display:block;height:24px;color:#8a91a8}
nav button.on{color:var(--ink)}nav button.on .i{color:var(--c)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px;color:#c9cde0}
input,select,textarea{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;background:#11141d;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 12px rgba(142,245,168,.4)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(142,245,168,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:#141722;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;background:#3a4058;border-radius:9px;margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:20px}
.btnrow{display:flex;gap:10px;margin-top:18px}.btnrow>*{flex:1}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
svg.chart{width:100%;height:auto;display:block}
.pos{color:var(--accent)}.neg{color:var(--red)}
.tm{width:64px;flex:none;font-size:13px;font-weight:700;color:var(--accent)}.fbtns{display:flex;gap:8px;margin-top:12px}.fbtns button{flex:1;min-height:44px;font-size:14px}.note{font-size:13px;color:var(--muted);margin-top:6px}
</style>
</head>

function fmtDay(s){var t=today();if(s===t)return'Today';var y=new Date();y.setDate(y.getDate()-1);if(s===iso(y))return'Yesterday';return parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(s){return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function money(n){n=n||0;return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2})}
function r1(n){return Math.round(n*10)/10}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function bar(p,color){return'<div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+color+'"></i></div>'}
function unit(){return S.settings.unit==='kg'?'kg':'lbs'}
function toDisp(lbs){return lbs==null?null:(S.settings.unit==='kg'?r1(lbs*0.45359237):r1(lbs))}
function fromDisp(v){return v==null?null:(S.settings.unit==='kg'?v/0.45359237:v)}
function byDateDesc(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)}
function groupByDay(arr){var g={},o=[];arr.slice().sort(byDateDesc).forEach(function(e){if(!g[e.date]){g[e.date]=[];o.push(e.date)}g[e.date].push(e)});return o.map(function(d){return{date:d,items:g[d]}})}
function emptyBox(icon,msg){return'<div class="empty"><div class="e">'+icon+'</div>'+msg+'</div>'}
var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}

/* ---------- computations ---------- */
function carbsOn(d){return S.carbs.filter(function(e){return e.date===d}).reduce(function(s,e){return s+(+e.carbs||0)},0)}
function weekExercise(){return S.exercise.filter(function(e){return inThisWeek(e.date)}).reduce(function(s,e){return s+(+e.minutes||0)},0)}
function sortedWeights(){return S.weights.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)})}
function latestWeight(){var w=sortedWeights();return w.length?w[w.length-1]:null}
function startWeight(){if(S.settings.startWeight!=null)return S.settings.startWeight;var w=sortedWeights();return w.length?w[0].lbs:null}
function monthTotals(){var inc=0,exp=0;S.money.forEach(function(e){if(!inThisMonth(e.date))return;if(e.kind==='income')inc+=+e.amount||0;else exp+=+e.amount||0});return{inc:inc,exp:exp}}
function saved(goal){return S.savings.filter(function(e){return e.goal===goal}).reduce(function(s,e){return s+(+e.amount||0)},0)}

/* ---------- fasting ---------- */
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtTime(t){var a=t.split(':'),d=new Date(2000,0,1,+a[0],+a[1]);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function byTime(a,b){if(!a.time&&!b.time)return 0;if(!a.time)return 1;if(!b.time)return -1;return a.time<b.time?-1:a.time>b.time?1:0}
function mealTs(e){if(!e.time||!/^\d{1,2}:\d{2}/.test(e.time))return null;var d=parse(e.date),a=e.time.split(':');d.setHours(+a[0],+a[1],0,0);return d.getTime()}
function dayMeals(d){return S.carbs.filter(function(e){return e.date===d}).map(mealTs).filter(function(t){return t!=null})}
function overnightFast(d){var f=dayMeals(d),p=new Date(parse(d));p.setDate(p.getDate()-1);var l=dayMeals(iso(p));if(!f.length||!l.length)return null;var g=Math.min.apply(null,f)-Math.max.apply(null,l);return g>0?g:null}
function lastMealTs(){var n=Date.now(),best=null;S.carbs.forEach(function(e){var t=mealTs(e);if(t!=null&&t<=n&&(best==null||t>best))best=t});return best}
function fastStartInfo(){var l=lastMealTs(),m=S.settings.fastStart,n=Date.now();if(m&&m<=n&&(l==null||m>l))return{ts:m,manual:true};return l==null?null:{ts:l,manual:false}}
function fmtDur(ms){var m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+'h '+pad(m%60)+'m'}
function fmtWhen(ts){var d=new Date(ts),s=iso(d);return(s===today()?'today':fmtDay(s).toLowerCase()==='yesterday'?'yesterday':fmtShort(s))+' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function fastCard(go){var g=S.settings.fastGoal||0,gm=g*3600000,fi=fastStartInfo(),on=overnightFast(today());
  var h='<div class="card"'+(go?' data-go="carbs"':'')+'><h2><span class="dot" style="background:rgba(142,245,168,.16)">'+ic('fast','var(--accent)',20)+'</span>Fasting<span class="tag">Goal '+g+' h</span></h2>';
  if(!fi&&on==null)return h+'<div class="muted">Log meals with a time and your overnight fast (last meal → first meal) will show here.</div>'+fastBtns()+'</div>';
  if(fi){var el=Date.now()-fi.ts;h+='<div class="big" id="liveFast">'+fmtDur(el)+' <small>fasting now</small></div>'+bar(pct(el,gm),'var(--accent)')+'<div class="muted">'+(fi.manual?'Fast started ':'Since last meal ')+fmtWhen(fi.ts)+(el>=gm&&gm>0?' · goal reached'+ok():gm>0?' · '+fmtDur(gm-el)+' to goal':'')+'</div>'}
  h+='<div class="muted" style="margin-top:10px">Overnight fast today: <b style="color:var(--ink)">'+(on!=null?fmtDur(on)+(gm>0&&on>=gm?ok():''):'—')+'</b>'+(on==null?' <span>(needs yesterday\'s last meal + today\'s first meal)</span>':'')+'</div>';
  return h+fastBtns()+'</div>'}
function fastBtns(){return'<div class="fbtns"><button class="ghost" data-fast="start">'+ic('fast','var(--accent)',16)+' Start fast now</button>'+(S.settings.fastStart?'<button class="ghost" data-fast="clear">Clear manual start</button>':'')+'</div>'}
function fastHistory(){var g=S.settings.fastGoal||0,gm=g*3600000,h='<div class="card"><h2>Overnight fasts<span class="tag">last 7 days</span></h2>',any=false;
  for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var s=iso(d),f=overnightFast(s);if(f!=null)any=true;
    h+='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+fmtDay(s)+'</span><b>'+(f!=null?fmtDur(f)+(gm>0&&f>=gm?ok():''):'<span class="muted">—</span>')+'</b></div>'+bar(f!=null?pct(f,gm||1):0,gm>0&&f>=gm?'var(--accent)':'#6b7390')+'</div>'}
  if(!any)h+='<p class="note">Each day\'s fast is measured from the previous day\'s last meal to that day\'s first meal.</p>';
  return h+'</div>'}
setInterval(function(){if((current==='home'||current==='carbs')&&!document.getElementById('sheetBg').classList.contains('open'))render()},30000);

/* ---------- render ---------- */
var current='home';
var TITLES={home:'Today',carbs:'Food',exercise:'Exercise',weight:'Weight',money:'Money',settings:'Settings'};
function show(v){current=v;document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('active',el.id==='v-'+v)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});document.getElementById('title').textContent=TITLES[v];document.getElementById('fab').classList.toggle('show',['carbs','exercise','weight','money'].indexOf(v)>=0);render();window.scrollTo(0,0)}
function render(){
  document.getElementById('subtitle').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  ({home:rHome,carbs:rCarbs,exercise:rExercise,weight:rWeight,money:rMoney,settings:rSettings})[current]();
}
function carbCard(){var t=carbsOn(today()),g=S.settings.carbTarget||0,left=g-t;
  return'<div class="card" data-go="carbs"><h2><span class="dot" style="background:rgba(255,178,30,.18)">'+ic('food','var(--accent2)',20)+'</span>Carbs today<span class="tag">Goal '+g+' g</span></h2><div class="big">'+r1(t)+' <small>/ '+g+' g</small></div>'+bar(pct(t,g),t>g?'var(--red)':'var(--accent2)')+'<div class="muted">'+(t===0&&!S.carbs.some(function(e){return e.date===today()})?'Nothing logged yet today. Tap to add a meal.':left>=0?r1(left)+' g left today':'<span class="neg">'+r1(-left)+' g over target</span>')+'</div></div>'}
function exCard(){var m=weekExercise(),g=S.settings.weeklyExercise||0;
  return'<div class="card" data-go="exercise"><h2><span class="dot" style="background:rgba(255,92,92,.18)">'+ic('ex','var(--ex)',20)+'</span>Exercise this week<span class="tag">Goal '+g+' min</span></h2><div class="big">'+m+' <small>/ '+g+' min</small></div>'+bar(pct(m,g),'var(--ex)')+'<div class="muted">'+(m===0?'No workouts yet this week. Every minute counts!':m>=g?'Weekly goal reached!'+ok():(g-m)+' min to go this week')+'</div></div>'}
function wCard(){var l=latestWeight(),st=startWeight(),gw=S.settings.goalWeight,u=unit();
  var h='<div class="card" data-go="weight"><h2><span class="dot" style="background:rgba(90,162,255,.18)">'+ic('weight','var(--blue)',20)+'</span>Weight<span class="tag">Goal '+(gw!=null?toDisp(gw)+' '+u:'not set')+'</span></h2>';
  if(!l)return h+'<div class="muted">Log your first weigh-in to start tracking progress.</div></div>';
  h+='<div class="big">'+toDisp(l.lbs)+' <small>'+u+' · '+fmtDay(l.date)+'</small></div>';
  if(gw!=null&&st!=null&&st!==gw){var p=pct(st-l.lbs,st-gw);h+=bar(p,'var(--blue)')+'<div class="muted">'+(st>gw?r1(toDisp(st)-toDisp(l.lbs))+' '+u+' lost · '+Math.max(0,r1(toDisp(l.lbs)-toDisp(gw)))+' '+u+' to go':Math.round(p)+'% to goal')+'</div>'}
  return h+'</div>'}
function mCard(){var t=monthTotals(),b=S.settings.monthlyBudget;
  var h='<div class="card" data-go="money"><h2><span class="dot" style="background:rgba(178,107,255,.2)">'+ic('money','var(--purple)',20)+'</span>Money this month</h2>';
  if(b){h+='<div class="big">'+money(t.exp)+' <small>/ '+money(b)+' budget</small></div>'+bar(pct(t.exp,b),t.exp>b?'var(--red)':'var(--purple)')+'<div class="muted">'+(t.exp<=b?money(b-t.exp)+' left to spend':'<span class="neg">'+money(t.exp-b)+' over budget</span>')+'</div>'}
  else h+='<div class="big">'+money(t.exp)+' <small>spent</small></div><div class="muted">Income '+money(t.inc)+' · no monthly budget set</div>';
  h+=savingsMini()+'</div>';return h}
function savingsMini(){return['short','long'].map(function(k){var s=saved(k),g=S.settings[k+'Goal']||0;return'<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>'+esc(S.settings[k+'Name'])+'</b><span class="muted">'+money(s)+' / '+money(g)+'</span></div>'+bar(pct(s,g),k==='short'?'var(--accent2)':'var(--accent)')+'</div>'}).join('')}
function rHome(){document.getElementById('v-home').innerHTML=carbCard()+fastCard(true)+exCard()+wCard()+mCard()+'<p class="note" style="text-align:center">Your data stays on this device. Back it up in Settings ('+ic('gear','#9ba1b8',14)+').</p>'}

function listItems(items,fn){return'<ul class="list">'+items.map(fn).join('')+'</ul>'}
function rCarbs(){var t=today(),h=carbCard().replace('data-go="carbs"','')+fastCard(false)+fastHistory();
  // last 7 days mini history
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  var g=S.settings.carbTarget||1,mx=Math.max(g,Math.max.apply(null,days.map(carbsOn)))||1;
  h+='<div class="card"><h2>Last 7 days</h2><svg class="chart" viewBox="0 0 350 130">'+'<line x1="0" x2="350" y1="'+(110-g/mx*95)+'" y2="'+(110-g/mx*95)+'" stroke="#8ef5a8" stroke-dasharray="4 4" stroke-width="1.5"/>'+days.map(function(d,i){var v=carbsOn(d),bh=v/mx*95,x=i*50+12;return'<rect x="'+x+'" y="'+(110-bh)+'" width="26" height="'+bh+'" rx="6" fill="'+(v>g?'#ff7a1a':'#ffb21e')+'"/><text x="'+(x+13)+'" y="126" font-size="11" text-anchor="middle" fill="#9ba1b8">'+parse(d).toLocaleDateString(undefined,{weekday:'narrow'})+'</text>'+(v?'<text x="'+(x+13)+'" y="'+(105-bh)+'" font-size="10" text-anchor="middle" fill="#e3e6f2">'+Math.round(v)+'</text>':'')}).join('')+'</svg></div>';
  h+='<div class="card"><h2>History</h2>';
  if(!S.carbs.length)h+=emptyBox(ic('food','var(--accent2)',40),'No meals logged yet.<br>Tap <b>+</b> to add what you ate and its carbs.');
  else groupByDay(S.carbs).forEach(function(g){g.items.sort(byTime);h+='<div class="dayhead"><span>'+fmtDay(g.date)+'</span><span>'+r1(carbsOn(g.date))+' g</span></div>'+listItems(g.items,function(e){return'<li data-edit="carbs" data-id="'+e.id+'"><div class="tm">'+(e.time?fmtTime(e.time):'no time')+'</div><div class="t"><b>'+esc(e.food||'Food')+'</b><span>'+esc(e.meal||'')+'</span></div><div class="v">'+r1(+e.carbs)+' g</div></li>'})});
  document.getElementById('v-carbs').innerHTML=h+'</div>'}
function exDetail(e){var p=[];if(e.type==='Weight lifting'){if(e.sets)p.push(e.sets+' sets');if(e.reps)p.push(e.reps+' reps');if(e.liftWeight)p.push(esc(e.liftWeight))}if(e.type==='Walking'){if(e.distance)p.push(e.distance+' mi');if(e.steps)p.push((+e.steps).toLocaleString()+' steps')}if(e.notes)p.push(esc(e.notes));return p.join(' · ')}
function exIcon(t){return ic({'Weight lifting':'ex','Walking':'shoe','Calisthenics':'person'}[t]||'star','var(--ex)',22)}
function rExercise(){var h=exCard().replace('data-go="exercise"','');
  var wk=S.exercise.filter(function(e){return inThisWeek(e.date)}),by={};wk.forEach(function(e){var k=e.type==='Other'?(e.custom||'Other'):e.type;by[k]=(by[k]||0)+(+e.minutes||0)});
  var ks=Object.keys(by);if(ks.length)h+='<div class="card"><h2>This week by activity</h2><div class="grid2">'+ks.map(function(k){return'<div class="stat"><b>'+by[k]+' min</b><span>'+esc(k)+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>History</h2>';
  if(!S.exercise.length)h+=emptyBox(ic('ex','var(--ex)',40),'No workouts logged yet.<br>Tap <b>+</b> to log a walk, lift, or calisthenics session.');
  else groupByDay(S.exercise).forEach(function(g){h+='<div class="dayhead"><span>'+fmtDay(g.date)+'</span><span>'+g.items.reduce(function(s,e){return s+(+e.minutes||0)},0)+' min</span></div>'+listItems(g.items,function(e){return'<li data-edit="exercise" data-id="'+e.id+'"><span class="lic">'+exIcon(e.type)+'</span><div class="t"><b>'+esc(e.type==='Other'?(e.custom||'Other'):e.type)+'</b><span>'+(exDetail(e)||'&nbsp;')+'</span></div><div class="v">'+(+e.minutes)+' min</div></li>'})});
  document.getElementById('v-exercise').innerHTML=h+'</div>'}
function chart(){var w=sortedWeights();if(w.length<2)return'<div class="muted" style="padding:10px 0">'+(w.length?'Add one more weigh-in to see your trend line.':'Your trend chart will appear here.')+'</div>';
  var W=350,H=180,pl=34,pr=10,pt=12,pb=24,gw=S.settings.goalWeight;
  var vals=w.map(function(e){return toDisp(e.lbs)});if(gw!=null)vals.push(toDisp(gw));
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx-mn<2){mn-=1;mx+=1}var padv=(mx-mn)*.08;mn-=padv;mx+=padv;
  var t0=parse(w[0].date).getTime(),t1=parse(w[w.length-1].date).getTime(),span=Math.max(1,t1-t0);
  function X(e){return w.length===1?pl:pl+(parse(e.date).getTime()-t0)/span*(W-pl-pr)}function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var pts=w.map(function(e){return X(e).toFixed(1)+','+Y(toDisp(e.lbs)).toFixed(1)});
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
  for(var i=0;i<=3;i++){var v=mn+(mx-mn)*i/3,y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#2a2f42"/><text x="'+(pl-5)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="#9ba1b8">'+Math.round(v)+'</text>'}
  if(gw!=null){var gy=Y(toDisp(gw));s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="#8ef5a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(gy-5)+'" font-size="10" text-anchor="end" fill="#8ef5a8">Goal '+toDisp(gw)+'</text>'}
  s+='<polygon points="'+pl+','+(H-pb)+' '+pts.join(' ')+' '+X(w[w.length-1]).toFixed(1)+','+(H-pb)+'" fill="rgba(90,162,255,.15)"/>';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#5aa2ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  w.forEach(function(e){s+='<circle cx="'+X(e).toFixed(1)+'" cy="'+Y(toDisp(e.lbs)).toFixed(1)+'" r="3.5" fill="#0d0f16" stroke="#5aa2ff" stroke-width="2"/>'});
  s+='<text x="'+pl+'" y="'+(H-6)+'" font-size="10" fill="#9ba1b8">'+fmtShort(w[0].date)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="10" text-anchor="end" fill="#9ba1b8">'+fmtShort(w[w.length-1].date)+'</text></svg>';return s}
function rWeight(){var h=wCard().replace('data-go="weight"',''),u=unit(),l=latestWeight(),st=startWeight(),gw=S.settings.goalWeight;
  h+='<div class="card"><h2>Trend<span class="tag"><span class="seg" style="display:inline-flex;padding:3px"><button data-unit="lb" class="'+(u==='lbs'?'on':'')+'" style="min-height:32px;padding:0 12px">lbs</button><button data-unit="kg" class="'+(u==='kg'?'on':'')+'" style="min-height:32px;padding:0 12px">kg</button></span></span></h2>'+chart();
  h+='<div class="grid2" style="margin-top:10px"><div class="stat"><b>'+(st!=null?toDisp(st)+' '+u:'—')+'</b><span>Start'+(S.settings.startWeight==null&&st!=null?' (first entry)':'')+'</span></div><div class="stat"><b>'+(gw!=null?toDisp(gw)+' '+u:'—')+'</b><span>Goal</span></div><div class="stat"><b>'+(l&&st!=null?(r1(toDisp(l.lbs)-toDisp(st))>0?'+':'')+r1(toDisp(l.lbs)-toDisp(st))+' '+u:'—')+'</b><span>Change since start</span></div><div class="stat"><b>'+(l&&gw!=null?Math.max(0,r1(toDisp(l.lbs)-toDisp(gw)))+' '+u:'—')+'</b><span>To goal</span></div></div><p class="note">Edit start & goal weight in Settings ('+ic('gear','#9ba1b8',14)+').</p></div>';
  h+='<div class="card"><h2>Weigh-ins</h2>';
  if(!S.weights.length)h+=emptyBox(ic('weight','var(--blue)',40),'No weigh-ins yet.<br>Tap <b>+</b> to log today\'s weight.');
  else{var sw=sortedWeights();h+=listItems(sw.slice().reverse(),function(e){var i=sw.indexOf(e),d=i>0?r1(toDisp(e.lbs)-toDisp(sw[i-1].lbs)):null;return'<li data-edit="weights" data-id="'+e.id+'"><div class="t"><b>'+fmtDay(e.date)+'</b><span>'+(d==null?'First entry':(d>0?'+':'')+d+' '+u+' vs previous')+'</span></div><div class="v">'+toDisp(e.lbs)+' '+u+'</div></li>'})}
  document.getElementById('v-weight').innerHTML=h+'</div>'}
var moneyTab='all';
function rMoney(){var h=mCard().replace('data-go="money"',''),t=monthTotals();
  h+='<div class="card"><h2>This month</h2><div class="grid2"><div class="stat"><b class="pos">'+money(t.inc)+'</b><span>Income</span></div><div class="stat"><b class="neg">'+money(t.exp)+'</b><span>Expenses</span></div><div class="stat"><b>'+money(t.inc-t.exp)+'</b><span>Net</span></div><div class="stat"><b>'+(S.settings.monthlyBudget?money(S.settings.monthlyBudget):'—')+'</b><span>Budget</span></div></div>';
  var cats={};S.money.forEach(function(e){if(e.kind==='expense'&&inThisMonth(e.date))cats[e.category]=(cats[e.category]||0)+(+e.amount||0)});var ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
  if(ck.length){h+='<div style="margin-top:12px">'+ck.map(function(k){return'<div style="display:flex;justify-content:space-between;font-size:14px;margin-top:8px"><span>'+esc(k)+'</span><b>'+money(cats[k])+'</b></div>'+bar(pct(cats[k],t.exp),'var(--purple)')}).join('')+'</div>'}
  h+='</div>';
  h+='<div class="card"><h2>Savings goals</h2>'+['short','long'].map(function(k){var s=saved(k),g=S.settings[k+'Goal']||0;return'<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>'+esc(S.settings[k+'Name'])+'</b><span class="muted">'+Math.round(pct(s,g))+'%</span></div><div class="big" style="font-size:22px">'+money(s)+' <small>/ '+money(g)+'</small></div>'+bar(pct(s,g),k==='short'?'var(--accent2)':'var(--accent)')+'<button class="ghost" style="width:100%;margin-top:6px" data-contrib="'+k+'">+ Add contribution</button></div>'}).join('')+'</div>';
  h+='<div class="card"><h2>Transactions</h2><div class="seg" style="margin-bottom:8px">'+[['all','All'],['expense','Expenses'],['income','Income'],['savings','Savings']].map(function(x){return'<button data-mtab="'+x[0]+'" class="'+(moneyTab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  var items=moneyTab==='savings'?S.savings.map(function(e){return Object.assign({_t:'savings'},e)}):S.money.filter(function(e){return moneyTab==='all'||e.kind===moneyTab}).map(function(e){return Object.assign({_t:'money'},e)});
  if(moneyTab==='all')items=items.concat(S.savings.map(function(e){return Object.assign({_t:'savings'},e)}));
  if(!items.length)h+=emptyBox(ic('money','var(--purple)',40),'Nothing here yet.<br>Tap <b>+</b> to log income or an expense.');
  else groupByDay(items).forEach(function(g){h+='<div class="dayhead"><span>'+fmtDay(g.date)+'</span></div>'+listItems(g.items,function(e){if(e._t==='savings')return'<li data-edit="savings" data-id="'+e.id+'"><span class="lic">'+ic('money',e.goal==='short'?'var(--accent2)':'var(--accent)',20)+'</span><div class="t"><b>'+esc(S.settings[e.goal+'Name'])+'</b><span>'+(esc(e.note)||'Savings contribution')+'</span></div><div class="v pos">'+money(+e.amount)+'</div></li>';return'<li data-edit="money" data-id="'+e.id+'"><span class="lic">'+(e.kind==='income'?ic('up','var(--accent)',18):ic('down','var(--purple)',18))+'</span><div class="t"><b>'+esc(e.category)+'</b><span>'+(esc(e.note)||(e.kind==='income'?'Income':'Expense'))+'</span></div><div class="v '+(e.kind==='income'?'pos':'')+'">'+(e.kind==='income'?'+':'-')+money(+e.amount)+'</div></li>'})});
  document.getElementById('v-money').innerHTML=h+'</div>'}
function rSettings(){var s=S.settings,u=unit();
  document.getElementById('v-settings').innerHTML='<form id="setForm"><div class="card"><h2>'+ic('food','var(--accent2)')+' Food &amp; fasting</h2><label for="s-carb">Daily carb target (g)</label><input id="s-carb" type="number" inputmode="numeric" min="0" step="1" value="'+(s.carbTarget??'')+'"><label for="s-fast">Daily fasting goal (hours)</label><input id="s-fast" type="number" inputmode="decimal" min="0" max="48" step="0.5" value="'+(s.fastGoal??'')+'"><p class="note">Fasting = overnight gap from the previous day\'s last meal to the day\'s first meal (meals need a time).</p></div>'+
  '<div class="card"><h2>'+ic('ex','var(--ex)')+' Exercise</h2><label for="s-ex">Weekly exercise goal (minutes)</label><input id="s-ex" type="number" inputmode="numeric" min="0" step="1" value="'+(s.weeklyExercise??'')+'"><p class="note">Weeks run Monday to Sunday.</p></div>'+
  '<div class="card"><h2>'+ic('weight','var(--blue)')+' Weight</h2><label>Units</label><div class="seg"><button type="button" data-unit="lb" class="'+(u==='lbs'?'on':'')+'">lbs</button><button type="button" data-unit="kg" class="'+(u==='kg'?'on':'')+'">kg</button></div><label for="s-sw">Start weight ('+u+')</label><input id="s-sw" type="number" inputmode="decimal" step="0.1" placeholder="Uses your first weigh-in if blank" value="'+(s.startWeight!=null?toDisp(s.startWeight):'')+'"><label for="s-gw">Goal weight ('+u+')</label><input id="s-gw" type="number" inputmode="decimal" step="0.1" value="'+(s.goalWeight!=null?toDisp(s.goalWeight):'')+'"></div>'+
  '<div class="card"><h2>'+ic('money','var(--purple)')+' Money</h2><label for="s-bud">Monthly spending budget ($, optional)</label><input id="s-bud" type="number" inputmode="decimal" step="0.01" min="0" placeholder="No budget" value="'+(s.monthlyBudget??'')+'"><label for="s-sn">Savings goal 1 name</label><input id="s-sn" type="text" value="'+esc(s.shortName)+'"><label for="s-sg">Savings goal 1 target ($)</label><input id="s-sg" type="number" inputmode="decimal" step="0.01" min="0" value="'+(s.shortGoal??'')+'"><label for="s-ln">Savings goal 2 name</label><input id="s-ln" type="text" value="'+esc(s.longName)+'"><label for="s-lg">Savings goal 2 target ($)</label><input id="s-lg" type="number" inputmode="decimal" step="0.01" min="0" value="'+(s.longGoal??'')+'"></div>'+
  '<button class="primary" type="submit" id="saveSettings">Save goals</button></form>'+
  '<div class="card" style="margin-top:14px"><h2>'+ic('backup','#9ba1b8')+' Backup</h2><p class="muted" style="margin-top:0">Your data lives only in this browser on this device. Export a backup file now and then, and import it to restore or move to another device.</p><div class="row"><button class="ghost" id="exportBtn">Export JSON</button><button class="ghost" id="importBtn">Import JSON</button></div><button class="ghost danger" id="resetBtn" style="width:100%;margin-top:10px">Erase all data</button></div><p class="note" style="text-align:center">Tip: on iPhone use Share → Add to Home Screen; on Android use ⋮ → Add to Home screen.</p>'}

/* ---------- forms (bottom sheet) ---------- */
var sheetBg=document.getElementById('sheetBg'),sheet=document.getElementById('sheet');
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;sheetBg.classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){sheetBg.classList.remove('open');document.body.style.overflow=''}
sheetBg.addEventListener('click',function(e){if(e.target===sheetBg)closeSheet()});
function field(id,lab,type,val,extra){return'<label for="'+id+'">'+lab+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'>'}
function chips(name,opts,val){return'<div class="chips" data-chips="'+name+'">'+opts.map(function(o){return'<button type="button" class="chip'+(o===val?' on':'')+'" data-val="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>'}
function chipVal(name){var c=sheet.querySelector('[data-chips="'+name+'"] .chip.on');return c?c.dataset.val:''}
function v(id){var el=document.getElementById(id);return el?el.value.trim():''}
function find(type,id){return S[type].filter(function(e){return e.id===id})[0]}
function footer(isEdit){return'<div class="btnrow">'+(isEdit?'<button type="button" class="ghost danger" id="delBtn">Delete</button>':'<button type="button" class="ghost" id="cancelBtn">Cancel</button>')+'<button type="submit" class="primary">'+(isEdit?'Save':'Add')+'</button></div>'}
function form(type,id,preset){
  var e=id?find(type,id):null,ed=!!e,h='',d=(e&&e.date)||today();
  if(type==='carbs'){h='<h3>'+(ed?'Edit meal':'Log carbs')+'</h3>'+field('f-food','What did you eat?','text',e&&e.food,'placeholder="e.g. Oatmeal with berries" autocomplete="off"')+field('f-carbs','Carbs (g)','number',e&&e.carbs,'inputmode="decimal" step="0.1" min="0" placeholder="0"')+'<label>Meal</label>'+chips('meal',MEALS,(e&&e.meal)||guessMeal())+'<div class="row"><div>'+field('f-time','Time','time',e?(e.time||''):nowHM())+'</div><div>'+field('f-date','Date','date',d)+'</div></div>'+(e&&!e.time?'<p class="note">No time saved for this meal, so it isn\'t counted for fasting. Add one to include it.</p>':'')}
  if(type==='exercise'){var t=(e&&e.type)||'Walking';h='<h3>'+(ed?'Edit workout':'Log exercise')+'</h3><label>Activity</label>'+chips('type',EX_TYPES,t)+'<div id="x-other">'+field('f-custom','Activity name','text',e&&e.custom,'placeholder="e.g. Cycling"')+'</div>'+field('f-min','Minutes','number',e&&e.minutes,'inputmode="numeric" min="1" step="1" placeholder="30"')+
    '<div id="x-lift"><div class="row"><div>'+field('f-sets','Sets (optional)','number',e&&e.sets,'inputmode="numeric" min="0"')+'</div><div>'+field('f-reps','Reps (optional)','number',e&&e.reps,'inputmode="numeric" min="0"')+'</div></div>'+field('f-lw','Weight used (optional)','text',e&&e.liftWeight,'placeholder="e.g. 3×10 squat @ 95 lb"')+'</div>'+
    '<div id="x-walk"><div class="row"><div>'+field('f-dist','Distance mi (optional)','number',e&&e.distance,'inputmode="decimal" step="0.01" min="0"')+'</div><div>'+field('f-steps','Steps (optional)','number',e&&e.steps,'inputmode="numeric" min="0"')+'</div></div></div>'+
    '<label for="f-notes">Notes (optional)</label><textarea id="f-notes" placeholder="How did it feel?">'+esc(e&&e.notes)+'</textarea>'+field('f-date','Date','date',d)}
  if(type==='weights'){h='<h3>'+(ed?'Edit weigh-in':'Log weight')+'</h3>'+field('f-w','Weight ('+unit()+')','number',e?toDisp(e.lbs):(latestWeight()?toDisp(latestWeight().lbs):''),'inputmode="decimal" step="0.1" min="0"')+field('f-date','Date','date',d)}
  if(type==='money'){var k=(e&&e.kind)||'expense';h='<h3>'+(ed?'Edit transaction':'Log money')+'</h3><div class="seg" id="kindSeg"><button type="button" data-kind="expense" class="'+(k==='expense'?'on':'')+'">Expense</button><button type="button" data-kind="income" class="'+(k==='income'?'on':'')+'">Income</button></div>'+field('f-amt','Amount ($)','number',e&&e.amount,'inputmode="decimal" step="0.01" min="0" placeholder="0.00"')+'<label>Category</label><div id="catWrap"></div>'+field('f-note','Note (optional)','text',e&&e.note,'placeholder="e.g. Weekly groceries"')+field('f-date','Date','date',d)}
  if(type==='savings'){var gk=(e&&e.goal)||preset||'short';h='<h3>'+(ed?'Edit contribution':'Add to savings')+'</h3><label>Goal</label><div class="seg" id="goalSeg"><button type="button" data-goal="short" class="'+(gk==='short'?'on':'')+'">'+esc(S.settings.shortName)+'</button><button type="button" data-goal="long" class="'+(gk==='long'?'on':'')+'">'+esc(S.settings.longName)+'</button></div>'+field('f-amt','Amount ($)','number',e&&e.amount,'inputmode="decimal" step="0.01" placeholder="0.00"')+'<p class="note">Use a negative amount to record a withdrawal.</p>'+field('f-note','Note (optional)','text',e&&e.note)+field('f-date','Date','date',d)}
  openSheet('<form id="entryForm" novalidate>'+h+footer(ed)+'</form>');
  var f=document.getElementById('entryForm');
  sheet.querySelectorAll('[data-chips]').forEach(function(g){g.addEventListener('click',function(ev){var b=ev.target.closest('.chip');if(!b)return;g.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});b.classList.add('on');if(type==='exercise')exVis()})});
  function exVis(){var t=chipVal('type');document.getElementById('x-other').classList.toggle('hidden',t!=='Other');document.getElementById('x-lift').classList.toggle('hidden',t!=='Weight lifting');document.getElementById('x-walk').classList.toggle('hidden',t!=='Walking')}
  if(type==='exercise')exVis();
  if(type==='money'){var kind=k;var cat=e&&e.category;function cats(){var list=kind==='income'?INC_CATS:EXP_CATS;var cur=list.indexOf(cat)>=0?cat:list[0];document.getElementById('catWrap').innerHTML=chips('cat',list,cur)}cats();
    document.getElementById('catWrap').addEventListener('click',function(ev){var b=ev.target.closest('.chip');if(!b)return;this.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});b.classList.add('on');cat=b.dataset.val});
    document.getElementById('kindSeg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;kind=b.dataset.kind;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});cats()})}
  var goal=type==='savings'?((e&&e.goal)||preset||'short'):null;
  if(type==='savings')document.getElementById('goalSeg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;goal=b.dataset.goal;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)})});
  var cb=document.getElementById('cancelBtn');if(cb)cb.onclick=closeSheet;
  var db=document.getElementById('delBtn');if(db)db.onclick=function(){if(!confirm('Delete this entry?'))return;S[type]=S[type].filter(function(x){return x.id!==id});save();closeSheet();render();toast('Deleted')};
  f.addEventListener('submit',function(ev){ev.preventDefault();var date=v('f-date')||today(),o;
    if(type==='carbs'){var c=num(v('f-carbs'));if(c==null||c<0)return bad('f-carbs','Enter grams of carbs');o={food:v('f-food')||'Food',carbs:c,meal:chipVal('meal'),time:v('f-time')}}
    if(type==='exercise'){var m=num(v('f-min'));if(m==null||m<=0)return bad('f-min','Enter minutes');var t=chipVal('type');o={type:t,minutes:Math.round(m),notes:v('f-notes')};if(t==='Other')o.custom=v('f-custom')||'Other';if(t==='Weight lifting'){o.sets=num(v('f-sets'));o.reps=num(v('f-reps'));o.liftWeight=v('f-lw')}if(t==='Walking'){o.distance=num(v('f-dist'));o.steps=num(v('f-steps'))}}
    if(type==='weights'){var w=num(v('f-w'));if(w==null||w<=0)return bad('f-w','Enter your weight');o={lbs:fromDisp(w)}}
    if(type==='money'){var a=num(v('f-amt'));if(a==null||a<=0)return bad('f-amt','Enter an amount');o={kind:sheet.querySelector('#kindSeg .on').dataset.kind,amount:a,category:chipVal('cat')||'Other',note:v('f-note')}}
    if(type==='savings'){var a2=num(v('f-amt'));if(a2==null||a2===0)return bad('f-amt','Enter an amount');o={goal:goal,amount:a2,note:v('f-note')}}
    o.date=date;
    if(ed){var keep={id:e.id,ts:e.ts};S[type]=S[type].map(function(x){return x.id===id?Object.assign(keep,o):x})}else{o.id=uid();o.ts=Date.now();S[type].push(o)}
    save();closeSheet();render();toast(ed?'Saved':'Added')});
  if(!ed){var first=sheet.querySelector('input:not([type=date])');if(first&&window.matchMedia('(pointer:fine)').matches)first.focus()}
}
function bad(id,msg){var el=document.getElementById(id);el.style.borderColor='var(--red)';el.focus();toast(msg)}
function guessMeal(){var h=new Date().getHours();return h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snack'}

/* ---------- events ---------- */
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.v)});
document.getElementById('settingsBtn').onclick=function(){show(current==='settings'?'home':'settings')};
document.getElementById('fab').onclick=function(){form({carbs:'carbs',exercise:'exercise',weight:'weights',money:'money'}[current])};
document.querySelector('main').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-unit]'))){e.preventDefault();if(current==='settings')stashSettings();S.settings.unit=t.dataset.unit;save();render();return}
  if((t=e.target.closest('[data-fast]'))){if(t.dataset.fast==='start'){S.settings.fastStart=Date.now();toast('Fast started')}else{S.settings.fastStart=null;toast('Manual start cleared')}save();render();return}
  if((t=e.target.closest('[data-contrib]'))){form('savings',null,t.dataset.contrib);return}
  if((t=e.target.closest('[data-mtab]'))){moneyTab=t.dataset.mtab;render();return}
  if((t=e.target.closest('[data-edit]'))){form(t.dataset.edit,t.dataset.id);return}
  if((t=e.target.closest('[data-go]'))){show(t.dataset.go);return}
  if(e.target.id==='exportBtn')exportData();
  if(e.target.id==='importBtn')document.getElementById('importFile').click();
  if(e.target.id==='resetBtn'){if(confirm('Erase ALL entries and reset goals to defaults? This cannot be undone. Consider exporting a backup first.')){S=clone(DEFAULTS);save();render();toast('All data erased')}}
});
function stashSettings(){var s=S.settings,n;
  n=num(v('s-carb'));s.carbTarget=n==null?0:n;n=num(v('s-fast'));s.fastGoal=n==null?0:n;n=num(v('s-ex'));s.weeklyExercise=n==null?0:n;
  n=num(v('s-sw'));s.startWeight=n==null?null:fromDisp(n);n=num(v('s-gw'));s.goalWeight=n==null?null:fromDisp(n);
  n=num(v('s-bud'));s.monthlyBudget=n&&n>0?n:null;s.shortName=v('s-sn')||'Short-term goal';s.longName=v('s-ln')||'Long-term goal';
  n=num(v('s-sg'));s.shortGoal=n==null?0:n;n=num(v('s-lg'));s.longGoal=n==null?0:n}
document.querySelector('main').addEventListener('submit',function(e){if(e.target.id==='setForm'){e.preventDefault();stashSettings();save();toast('Goals saved');show('home')}});
function exportData(){var data=JSON.stringify(Object.assign({app:'wellbeing-tracker',version:1,exported:new Date().toISOString()},S),null,2);var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wellbeing-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup downloaded')}
document.getElementById('importFile').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p||typeof p!=='object'||!p.settings)throw new Error('bad');if(!confirm('Replace current data with this backup?'))return;S=merge(p);save();render();toast('Backup restored')}catch(err){alert('That file doesn\'t look like a Well-being Tracker backup.')}};r.readAsText(f);this.value=''});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
window.addEventListener('storage',function(e){if(e.key===KEY){S=load();render()}});
show('home');
})();
</script>
