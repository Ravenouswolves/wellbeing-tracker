<title>GoalWell</title>
<style>
:root{color-scheme:dark;--bg:#0d0f16;--card:#181b26;--ink:#f4f5fa;--muted:#9ba1b8;--line:#2a2f42;--accent:#8ef5a8;--on-accent:#06240f;--accent2:#ffb21e;--ex:#ff5c5c;--blue:#4f7bff;--fast:#7dd3fc;--know:#2dd4bf;--skill:#ff5cc8;--spirit:#ffe27a;--obs:#c6f25a;--purple:#b26bff;--red:#ff7a1a;--r:18px;--nav:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
header{position:sticky;top:0;z-index:5;background:rgba(13,15,22,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;justify-content:space-between}
header .brand{display:flex;align-items:center;gap:10px;min-width:0}header .brandmark{flex:none;display:block}body:not(.home) header .brandmark{display:none}header h1{font-size:24px;margin:0;letter-spacing:-.3px}
header .sub{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:20px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:4px 14px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 20px rgba(0,0,0,.35)}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.big small{font-size:15px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
button.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;cursor:pointer}
button.ghost{min-height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;padding:0 16px}
button.danger{color:var(--red);border-color:rgba(255,122,26,.45)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:34px;line-height:1;box-shadow:0 6px 22px rgba(142,245,168,.55);cursor:pointer;z-index:6;display:none}
.fab.show{display:block}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
ul.list li:last-child{border-bottom:0}
ul.list li .t{flex:1;min-width:0}
ul.list li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.list li .t span{font-size:13px;color:var(--muted)}
ul.list li .v{font-weight:700;white-space:nowrap}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 2px;display:flex;justify-content:space-between}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{margin-bottom:8px;opacity:.85}.ico{display:inline-block;vertical-align:middle;flex:none}.lic{width:28px;display:grid;place-items:center;flex:none}h2 .ico{margin-right:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(20,23,33,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav button{flex:1;min-width:0;height:var(--nav);border:0;background:none;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#8a91a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button .i{display:block;height:24px;color:#8a91a8}
nav button.on{color:var(--ink)}nav button.on .i{color:var(--c)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px;color:#c9cde0}
input,select,textarea{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;background:#11141d;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 12px rgba(142,245,168,.4)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(142,245,168,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:#141722;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;background:#3a4058;border-radius:9px;margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:20px}
.btnrow{display:flex;gap:10px;margin-top:18px}.btnrow>*{flex:1}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
svg.chart{width:100%;height:auto;display:block}
.pos{color:var(--accent)}.neg{color:var(--red)}
.morebtn{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 14px;margin-top:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit}.morebtn b{display:block;font-size:17px}.morebtn span.s{font-size:13px;color:var(--muted)}.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.srow:last-child{border-bottom:0}.srow .t{flex:1;min-width:0}.srow .bar{margin:6px 0 2px;height:9px}.smallbtn{min-height:40px!important;padding:0 14px!important;font-size:14px!important}.obsrow{padding:12px 0;border-bottom:1px solid var(--line)}.obsrow:last-of-type{border-bottom:0}.obshd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.obshd b{font-size:16px}.obsword{font-size:14px;font-weight:700;color:var(--obs)}.scale{display:flex;gap:8px;margin:10px 0 8px}.scale button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer}.scale button.on{background:var(--obs);border-color:var(--obs);color:#1b2406;box-shadow:0 2px 10px rgba(198,242,90,.35)}.scale button.lt{background:rgba(198,242,90,.14);border-color:rgba(198,242,90,.35)}.scalelbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px;margin-bottom:6px}input.obsnote{min-height:44px;font-size:15px;padding:10px 12px}.daynav{display:flex;align-items:center;gap:8px;margin-bottom:6px}.daynav input{flex:1;min-height:44px;font-size:16px}.daynav button{min-height:44px;min-width:44px;padding:0 12px}.trendrow{display:flex;align-items:center;gap:10px;padding:8px 0}.trendrow .n{width:76px;flex:none;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trendrow svg{flex:1;height:30px}.trendrow .avg{width:46px;text-align:right;font-weight:700;font-size:14px}.mini5{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.mini5 i{width:8px;height:8px;border-radius:50%;background:#2a2f42;display:block}.mini5 i.on{background:var(--obs)}.smallbtn{min-height:40px;padding:0 12px;font-size:14px;flex:none}.obschips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.obschips span{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(198,242,90,.12);color:#dff7a6}.tm{width:64px;flex:none;font-size:13px;font-weight:700;color:var(--accent)}.fbtns{display:flex;gap:8px;margin-top:12px}.fbtns button{flex:1;min-height:44px;font-size:14px}.note{font-size:13px;color:var(--muted);margin-top:6px}
</style>

\"1.7\" rx=\".85\"/>", "lotus": "<path d=\"M12 2.6c2.1 2.3 3.2 4.8 3.2 7.5S14 15 12 17.2C10 15 8.8 12.8 8.8 10.1S9.9 4.9 12 2.6Z\"/><path d=\"M1.8 8.6c3.2.2 5.8 1.6 7.6 3.9.9 1.3 1.6 2.8 1.9 4.6-2.7-.1-5.1-1.1-6.9-2.9C3 12.8 2 10.9 1.8 8.6Z\" opacity=\".75\"/><path d=\"M22.2 8.6c-3.2.2-5.8 1.6-7.6 3.9-.9 1.3-1.6 2.8-1.9 4.6 2.7-.1 5.1-1.1 6.9-2.9C21 12.8 22 10.9 22.2 8.6Z\" opacity=\".75\"/><rect x=\"4\" y=\"18.8\" width=\"16\" height=\"2.4\" rx=\"1.2\"/>", "flame": "<path d=\"M12 1.8c2.8 3.1 4.4 5.6 4.4 8.1a4.4 4.4 0 0 1-8.8 0c0-1.6.7-3 1.8-4.3.2 1.3.8 2.2 1.7 2.6C11 6.3 11.2 4 12 1.8Z\"/><rect x=\"9\" y=\"15.5\" width=\"6\" height=\"6.7\" rx=\"1.2\" opacity=\".75\"/>", "tree": "<path d=\"M12 1.8 19 12.4H15.4L20.2 18.6H3.8L8.6 12.4H5Z\"/><rect x=\"10.7\" y=\"18\" width=\"2.6\" height=\"4.2\" rx=\".8\"/>", "grid": "<rect x=\"3\" y=\"3\" width=\"7.8\" height=\"7.8\" rx=\"2.2\"/><rect x=\"13.2\" y=\"3\" width=\"7.8\" height=\"7.8\" rx=\"2.2\"/><rect x=\"3\" y=\"13.2\" width=\"7.8\" height=\"7.8\" rx=\"2.2\"/><rect x=\"13.2\" y=\"13.2\" width=\"7.8\" height=\"7.8\" rx=\"2.2\"/>", "journal": "<rect x=\"3\" y=\"2.5\" width=\"14\" height=\"19\" rx=\"2.2\"/><rect x=\"3\" y=\"2.5\" width=\"3.4\" height=\"19\" rx=\"1.4\" fill=\"#000\" opacity=\".28\"/><rect x=\"8.6\" y=\"7\" width=\"6\" height=\"1.5\" rx=\".75\" fill=\"#000\" opacity=\".35\"/><rect x=\"8.6\" y=\"10.4\" width=\"6\" height=\"1.5\" rx=\".75\" fill=\"#000\" opacity=\".35\"/><rect x=\"8.6\" y=\"13.8\" width=\"4\" height=\"1.5\" rx=\".75\" fill=\"#000\" opacity=\".35\"/><path d=\"M19.3 6.2a1.3 1.3 0 0 1 1.8-.1l.9.8a1.3 1.3 0 0 1 .1 1.8l-6.9 8.2-2.9.9.2-3Z\"/><path d=\"M12.6 17.2 12.3 20.6 15.5 19.4Z\" opacity=\".55\"/>"};

var KEY='wellbeingTracker.v1';
var DEFAULTS={settings:{carbTarget:100,fastGoal:14,fastStart:null,weeklyExercise:135,unit:'lb',startWeight:null,goalWeight:165,monthlyBudget:null,shortName:'Short-term goal',shortGoal:3000,longName:'Long-term goal',longGoal:15000,readGoal:30,booksGoal:1,skillGoalDefault:120,medGoal:10,scrGoal:15,prayGoal:10,outGoal:30,obsItems:[{id:'mood',name:'Mood',labels:['Low','Meh','Okay','Good','Great']},{id:'focus',name:'Focus',labels:['Scattered','Distracted','Steady','Sharp','Locked in']},{id:'purpose',name:'Purpose',labels:['Drifting','Unsure','Steady','Motivated','Driven']}]},carbs:[],exercise:[],weights:[],money:[],savings:[],reading:[],books:[],skills:[],practice:[],spirit:[],obs:[]};
var EX_TYPES=['Weight lifting','Walking','Calisthenics','Other'];
var MEALS=['Breakfast','Lunch','Dinner','Snack'];
var EXP_CATS=['Groceries','Dining','Housing','Utilities','Transport','Health','Shopping','Entertainment','Bills','Other'];
var INC_CATS=['Salary','Side income','Gift','Refund','Other'];
var S;
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  var d=clone(DEFAULTS);
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);d=merge(p)}}catch(e){console.warn('load failed',e)}
  return d;
}
function merge(p){var d=mergeRaw(p);if(!Array.isArray(d.settings.obsItems)||!d.settings.obsItems.every(function(x){return x&&x.id&&x.name}))d.settings.obsItems=clone(DEFAULTS.settings.obsItems);return d}
function mergeRaw(p){var d=clone(DEFAULTS);if(p&&typeof p==='object'){Object.keys(d.settings).forEach(function(k){if(p.settings&&k in p.settings)d.settings[k]=p.settings[k]});['carbs','exercise','weights','money','savings','reading','books','skills','practice','spirit','obs'].forEach(function(k){if(Array.isArray(p[k]))d[k]=p[k]})}return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save (storage full or blocked)')}}
S=load();

/* ---------- helpers ---------- */
function pad(n){return(n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function weekStart(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d}
function inThisWeek(s){var ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);var d=parse(s);return d>=ws&&d<we}
function inThisMonth(s){return s.slice(0,7)===today().slice(0,7)}
function fmtDay(s){var t=today();if(s===t)return'Today';var y=new Date();y.setDate(y.getDate()-1);if(s===iso(y))return'Yesterday';return parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(s){return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function money(n){n=n||0;return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2})}
function r1(n){return Math.round(n*10)/10}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function bar(p,color){return'<div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+color+'"></i></div>'}
function unit(){return S.settings.unit==='kg'?'kg':'lbs'}
function toDisp(lbs){return lbs==null?null:(S.settings.unit==='kg'?r1(lbs*0.45359237):r1(lbs))}
function fromDisp(v){return v==null?null:(S.settings.unit==='kg'?v/0.45359237:v)}
function byDateDesc(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)}
function groupByDay(arr){var g={},o=[];arr.slice().sort(byDateDesc).forEach(function(e){if(!g[e.date]){g[e.date]=[];o.push(e.date)}g[e.date].push(e)});return o.map(function(d){return{date:d,items:g[d]}})}
function emptyBox(icon,msg){return'<div class="empty"><div class="e">'+icon+'</div>'+msg+'</div>'}
var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}

/* ---------- computations ---------- */
function carbsOn(d){return S.carbs.filter(function(e){return e.date===d}).reduce(function(s,e){return s+(+e.carbs||0)},0)}
function weekExercise(){return S.exercise.filter(function(e){return inThisWeek(e.date)}).reduce(function(s,e){return s+(+e.minutes||0)},0)}
function sortedWeights(){return S.weights.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)})}
function latestWeight(){var w=sortedWeights();return w.length?w[w.length-1]:null}
function startWeight(){if(S.settings.startWeight!=null)return S.settings.startWeight;var w=sortedWeights();return w.length?w[0].lbs:null}
function monthTotals(){var inc=0,exp=0;S.money.forEach(function(e){if(!inThisMonth(e.date))return;if(e.kind==='income')inc+=+e.amount||0;else exp+=+e.amount||0});return{inc:inc,exp:exp}}
function savedDirect(goal){return S.savings.filter(function(e){return e.goal===goal}).reduce(function(s,e){return s+(+e.amount||0)},0)}
/* short-term contributions also count toward long-term (computed, never stored twice) */
function saved(goal){return goal==='long'?savedDirect('long')+savedDirect('short'):savedDirect('short')}
function linkNote(){var x=savedDirect('short');return x?'includes '+money(x)+' from '+esc(S.settings.shortName):''}

/* ---------- fasting ---------- */
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtTime(t){var a=t.split(':'),d=new Date(2000,0,1,+a[0],+a[1]);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function byTime(a,b){if(!a.time&&!b.time)return 0;if(!a.time)return 1;if(!b.time)return -1;return a.time<b.time?-1:a.time>b.time?1:0}
function mealTs(e){if(!e.time||!/^\d{1,2}:\d{2}/.test(e.time))return null;var d=parse(e.date),a=e.time.split(':');d.setHours(+a[0],+a[1],0,0);return d.getTime()}
function dayMeals(d){return S.carbs.filter(function(e){return e.date===d}).map(mealTs).filter(function(t){return t!=null})}
function overnightFast(d){var f=dayMeals(d),p=new Date(parse(d));p.setDate(p.getDate()-1);var l=dayMeals(iso(p));if(!f.length||!l.length)return null;var g=Math.min.apply(null,f)-Math.max.apply(null,l);return g>0?g:null}
function lastMealTs(){var n=Date.now(),best=null;S.carbs.forEach(function(e){var t=mealTs(e);if(t!=null&&t<=n&&(best==null||t>best))best=t});return best}
function fastStartInfo(){var l=lastMealTs(),m=S.settings.fastStart,n=Date.now();if(m&&m<=n&&(l==null||m>l))return{ts:m,manual:true};return l==null?null:{ts:l,manual:false}}
function fmtDur(ms){var m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+'h '+pad(m%60)+'m'}
function fmtWhen(ts){var d=new Date(ts),s=iso(d);return(s===today()?'today':fmtDay(s).toLowerCase()==='yesterday'?'yesterday':fmtShort(s))+' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function fastCard(go){var g=S.settings.fastGoal||0,gm=g*3600000,fi=fastStartInfo(),on=overnightFast(today());
  var h='<div class="card"'+(go?' data-go="carbs"':'')+'><h2><span class="dot" style="background:rgba(125,211,252,.16)">'+ic('fast','var(--fast)',20)+'</span>Fasting<span class="tag">Goal '+g+' h</span></h2>';
  if(!fi&&on==null)return h+'<div class="muted">Log meals with a time and your overnight fast (last meal → first meal) will show here.</div>'+fastBtns()+'</div>';
  if(fi){var el=Date.now()-fi.ts;h+='<div class="big" id="liveFast">'+fmtDur(el)+' <small>fasting now</small></div>'+bar(pct(el,gm),'var(--fast)')+'<div class="muted">'+(fi.manual?'Fast started ':'Since last meal ')+fmtWhen(fi.ts)+(el>=gm&&gm>0?' · goal reached'+ok():gm>0?' · '+fmtDur(gm-el)+' to goal':'')+'</div>'}
  h+='<div class="muted" style="margin-top:10px">Overnight fast today: <b style="color:var(--ink)">'+(on!=null?fmtDur(on)+(gm>0&&on>=gm?ok():''):'—')+'</b>'+(on==null?' <span>(needs yesterday\'s last meal + today\'s first meal)</span>':'')+'</div>';
  return h+fastBtns()+'</div>'}
function fastBtns(){return'<div class="fbtns"><button class="ghost" data-fast="start">'+ic('fast','var(--fast)',16)+' Start fast now</button>'+(S.settings.fastStart?'<button class="ghost" data-fast="clear">Clear manual start</button>':'')+'</div>'}
function fastHistory(){var g=S.settings.fastGoal||0,gm=g*3600000,h='<div class="card"><h2>Overnight fasts<span class="tag">last 7 days</span></h2>',any=false;
  for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var s=iso(d),f=overnightFast(s);if(f!=null)any=true;

  if(e.target.id==='exportBtn')exportData();
  if(e.target.id==='importBtn')document.getElementById('importFile').click();
  if(e.target.id==='resetBtn'){if(confirm('Erase ALL entries and reset goals to defaults? This cannot be undone. Consider exporting a backup first.')){S=clone(DEFAULTS);save();render();toast('All data erased')}}
});
function stashSettings(){var s=S.settings,n;
  n=num(v('s-carb'));s.carbTarget=n==null?0:n;n=num(v('s-fast'));s.fastGoal=n==null?0:n;n=num(v('s-ex'));s.weeklyExercise=n==null?0:n;
  n=num(v('s-sw'));s.startWeight=n==null?null:fromDisp(n);n=num(v('s-gw'));s.goalWeight=n==null?null:fromDisp(n);
  n=num(v('s-bud'));s.monthlyBudget=n&&n>0?n:null;s.shortName=v('s-sn')||'Short-term goal';s.longName=v('s-ln')||'Long-term goal';
  n=num(v('s-sg'));s.shortGoal=n==null?0:n;n=num(v('s-lg'));s.longGoal=n==null?0:n;
  n=num(v('s-read'));s.readGoal=n==null?0:n;n=num(v('s-bk'));s.booksGoal=n==null?0:n;n=num(v('s-skd'));s.skillGoalDefault=n==null?0:n;SPIRIT.forEach(function(x){var q=num(v('s-'+x.g));s[x.g]=q==null?0:q})}
document.querySelector('main').addEventListener('submit',function(e){if(e.target.id==='setForm'){e.preventDefault();stashSettings();save();toast('Goals saved');show('home')}});
function exportData(){var data=JSON.stringify(Object.assign({app:'wellbeing-tracker',version:1,exported:new Date().toISOString()},S),null,2);var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='goalwell-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup downloaded')}
document.getElementById('importFile').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p||typeof p!=='object'||!p.settings)throw new Error('bad');if(!confirm('Replace current data with this backup?'))return;S=merge(p);save();render();toast('Backup restored')}catch(err){alert('That file doesn\'t look like a GoalWell backup.')}};r.readAsText(f);this.value=''});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
window.addEventListener('storage',function(e){if(e.key===KEY){S=load();render()}});
show('home');
})();
</script>
